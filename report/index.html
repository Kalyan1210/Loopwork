<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qwen Behavior Lab: report</title>
<style>
:root{
  color-scheme: light;
  --page:#f9f9f7; --surface:#fcfcfb; --surface2:#f3f2ee; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10); --border2:rgba(11,11,11,.18);
  --c-intervention:#2a78d6; --c-control:#eb6834; --c-baseline:#1baf7a;
  --good:#0ca30c; --goodtext:#006300; --warn:#fab219; --crit:#d03b3b;
  --link:#1c5cab; --shadow:0 1px 2px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --surface2:#232321; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10); --border2:rgba(255,255,255,.2);
    --c-intervention:#3987e5; --c-control:#d95926; --c-baseline:#199e70;
    --goodtext:#0ca30c; --crit:#e66767; --link:#86b6ef; --shadow:none;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--link)}
code,pre,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
nav#nav{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);display:flex;gap:2px;overflow-x:auto;padding:6px 16px;white-space:nowrap}
nav#nav a{color:var(--ink2);text-decoration:none;padding:5px 9px;border-radius:6px;font-size:13px}
nav#nav a:hover{background:var(--surface2)}
nav#nav a.on{background:var(--surface2);color:var(--ink);font-weight:600}
main{max-width:1280px;margin:0 auto;padding:20px 20px 80px}
section{scroll-margin-top:52px;margin:0 0 36px}
h1{font-size:26px;margin:8px 0 4px;letter-spacing:-.01em}
h2{font-size:20px;margin:0 0 4px;padding-top:6px}
h3{font-size:15px;margin:18px 0 6px}
h4{font-size:13px;margin:12px 0 4px;color:var(--ink2)}
p{margin:6px 0}
.sub{color:var(--ink2);margin:0 0 12px;max-width:95ch}
.note{color:var(--ink2);font-size:13px}
.muted{color:var(--muted)}
.nw{white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:10px 0;box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:12px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:860px){.cols2{grid-template-columns:1fr}}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:10px;margin:12px 0}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.tile .l{color:var(--ink2);font-size:12px}
.tile .v{font-size:22px;font-weight:600;line-height:1.25}
.tile .d{color:var(--ink2);font-size:12px}
.hero .v{font-size:48px;line-height:1.1}
.meter{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--c-intervention);border-radius:4px}
.banner{border:1px solid var(--border2);border-left:4px solid var(--warn);background:var(--surface);border-radius:8px;padding:9px 12px;margin:10px 0}
.na{color:var(--muted);font-style:italic;padding:6px 0}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--grid);vertical-align:top}
th{color:var(--ink2);font-weight:600;font-size:12px;background:var(--surface);position:sticky;top:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow:auto;max-width:100%}
.badge{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border2);border-radius:999px;padding:1px 8px 1px 6px;font-size:11.5px;white-space:nowrap;color:var(--ink);background:var(--surface)}
.badge i{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.t-baseline i,.sw.t-baseline{background:var(--c-baseline)} .t-intervention i,.sw.t-intervention{background:var(--c-intervention)} .t-control i,.sw.t-control{background:var(--c-control)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.lab{display:inline-block;border-radius:4px;padding:1px 7px;font-size:11.5px;font-weight:600;border:1px solid var(--border2);background:var(--surface2)}
.lab.l-failure{border-color:var(--crit)} .lab.l-edge{border-color:var(--warn)} .lab.l-rep{border-color:var(--c-intervention)}
.st{font-weight:600;white-space:nowrap}
.st.p::before{content:"\2713  ";color:var(--good)} .st.f::before{content:"\2717  ";color:var(--crit)} .st.e::before{content:"!  ";color:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:14px;color:var(--ink2);font-size:12px;margin:4px 0 6px}
.legend span{display:inline-flex;align-items:center}
svg text{fill:var(--ink2);font:12px system-ui,-apple-system,"Segoe UI",sans-serif}
svg text.lbl{fill:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
svg text.tick{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
svg .gridl{stroke:var(--grid);stroke-width:1} svg .axisl{stroke:var(--axis);stroke-width:1}
svg .f-baseline{fill:var(--c-baseline)} svg .f-intervention{fill:var(--c-intervention)} svg .f-control{fill:var(--c-control)}
svg .s-baseline{stroke:var(--c-baseline)} svg .s-intervention{stroke:var(--c-intervention)} svg .s-control{stroke:var(--c-control)}
svg .ci{stroke:var(--ink);stroke-width:1.5} svg .ring{stroke:var(--surface);stroke-width:2}
svg .hit{fill:transparent} svg g.row:hover .hit{fill:var(--surface2)}
.chart{min-width:760px}
.heat td,.heat th{border:2px solid var(--surface);padding:0;text-align:center}
.heat th{padding:4px 6px;font-size:11.5px;position:static}
.heat th.rowh{text-align:left;white-space:nowrap}
.heat button{all:unset;display:block;width:100%;padding:7px 4px;cursor:pointer;font-variant-numeric:tabular-nums;font-size:12.5px;border-radius:3px;text-align:center;box-sizing:border-box}
.heat button:hover,.heat button:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.heat .nocell{color:var(--muted);padding:7px 4px;display:block}
.vth{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;font:11px ui-monospace,Menlo,monospace;padding:4px 2px}
.seg{display:inline-flex;border:1px solid var(--border2);border-radius:7px;overflow:hidden}
.seg button{all:unset;padding:4px 11px;font-size:13px;cursor:pointer;color:var(--ink2)}
.seg button.on{background:var(--ink);color:var(--surface)}
.seg button:disabled{opacity:.45;cursor:not-allowed}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin:8px 0}
.filters label{display:flex;flex-direction:column;font-size:11.5px;color:var(--ink2);gap:2px}
select,input[type=text]{font:inherit;font-size:13px;padding:4px 7px;border:1px solid var(--border2);border-radius:6px;background:var(--surface);color:var(--ink)}
button.btn{font:inherit;font-size:13px;padding:4px 10px;border:1px solid var(--border2);border-radius:6px;background:var(--surface);color:var(--ink);cursor:pointer}
button.btn:disabled{opacity:.4;cursor:default}
button.link{all:unset;color:var(--link);cursor:pointer;text-decoration:underline;font-family:ui-monospace,Menlo,monospace;font-size:12px}
pre{white-space:pre-wrap;word-break:break-word;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:8px;margin:4px 0;max-height:300px;overflow:auto}
.mini{display:inline-block;width:54px;height:6px;background:var(--surface2);border-radius:3px;vertical-align:middle;margin-right:6px;overflow:hidden}
.mini i{display:block;height:100%;border-radius:3px}
.mini .t-baseline,.mini .t-intervention,.mini .t-control{}
.mini i.t-baseline{background:var(--c-baseline)} .mini i.t-intervention{background:var(--c-intervention)} .mini i.t-control{background:var(--c-control)}
.kv{display:grid;grid-template-columns:minmax(150px,max-content) 1fr;gap:3px 14px;font-size:13px}
.kv dt{color:var(--ink2)} .kv dd{margin:0;word-break:break-word}
details>summary{cursor:pointer;color:var(--ink2);font-size:13px}
.ep{border:1px solid var(--border);border-radius:8px;padding:10px;background:var(--surface);min-width:0}
.ep .eph{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:4px}
.checks{list-style:none;margin:4px 0;padding:0;font-size:12.5px}
.checks li{padding:1px 0}
.ck-p::before{content:"\2713";color:var(--good);font-weight:700;margin-right:6px} .ck-f::before{content:"\2717";color:var(--crit);font-weight:700;margin-right:6px}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--surface);padding:6px 9px;border-radius:6px;font-size:12px;white-space:pre-line;max-width:340px;display:none;line-height:1.4}
.exgrid{display:grid;grid-template-columns:330px 1fr;gap:14px}
@media (max-width:980px){.exgrid{grid-template-columns:1fr}}
tr.c1 td{border-bottom:0;padding-top:9px}
tr.sel td{background:var(--surface2)}
tr.pick{cursor:pointer} tr.pick:hover td{background:var(--surface2)}
.dotc{font-size:12px;text-align:center;padding:5px 2px}
.dp{color:var(--good)} .df{color:var(--crit)} .de{color:var(--warn)} .dn{color:var(--muted)}
iframe{width:100%;height:900px;border:1px solid var(--border2);border-radius:10px;background:#0b0e13}
.interp{border-left:4px solid var(--muted)}
.err{color:var(--crit)}
</style>
</head>
<body>
<nav id="nav" aria-label="Sections"></nav>
<main id="main">
<noscript>This report needs JavaScript to render the data files in report/data/.</noscript>
</main>
<div id="tip" role="tooltip"></div>
<script src="data/lab.js"></script>
<script>
(function(){
'use strict';
var L = window.LAB || {};
var S = L.summary || {};
var SC = S.conditions || {};
var NA = 'not available yet';
var REQUESTED_PER_CONDITION = 10000; // size of the original request (a specification, not a measurement)

/* ---------- helpers ---------- */
function esc(s){ return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function isNum(x){ return typeof x === 'number' && isFinite(x); }
function pct(r, d){ return isNum(r) ? (r*100).toFixed(d === undefined ? 1 : d) + '%' : 'n/a'; }
function pp(d){ return isNum(d) ? (d > 0 ? '+' : d < 0 ? '−' : '') + Math.abs(d*100).toFixed(1) + ' pp' : 'n/a'; }
function pv(p){ return isNum(p) ? (p < 0.001 ? '<0.001' : p.toFixed(3)) : 'n/a'; }
function int(n){ return isNum(n) ? Math.round(n).toLocaleString('en-US') : 'n/a'; }
function fx(n, d){ return isNum(n) ? n.toFixed(d === undefined ? 2 : d) : 'n/a'; }
function obj(x){ return x && typeof x === 'object' && !Array.isArray(x) ? x : {}; }
function arr(x){ return Array.isArray(x) ? x : []; }
function keys(x){ return Object.keys(obj(x)); }
function rk(r){ r = obj(r); return isNum(r.k) && isNum(r.n) ? r.k + '/' + r.n : ''; }
function ci(c){ c = arr(c); return isNum(c[0]) && isNum(c[1]) ? [c[0], c[1]] : null; }
function short(s, n){ s = String(s || ''); n = n || 12; return s.length > n ? s.slice(0, n) + '…' : s; }
function jstr(v){ try { return JSON.stringify(v); } catch(e){ return String(v); } }
function jpretty(v){ try { return JSON.stringify(v, null, 1); } catch(e){ return String(v); } }
function na(msg){ return '<div class="na">' + esc(msg || NA) + '</div>'; }
function $(id){ return document.getElementById(id); }

/* ---------- condition model ---------- */
var cfgConds = arr(obj(L.config).conditions);
var CONDS = (cfgConds.length ? cfgConds : arr(L.conditions)).map(function(c){ return obj(c); }).filter(function(c){ return c.id; });
arr(L.conditions).forEach(function(c){ if (c && c.id && !CONDS.some(function(x){ return x.id === c.id; })) CONDS.push(c); });
keys(SC).forEach(function(id){ if (!CONDS.some(function(x){ return x.id === id; })) CONDS.push({id:id}); });
var CMAP = {}; CONDS.forEach(function(c){ CMAP[c.id] = c; });
var DCONDS = CONDS.filter(function(c){ return obj(SC[c.id]).episodes > 0 || keys(obj(L.scores)[c.id]).length > 0; }).map(function(c){ return c.id; });
var HAS_BASE = DCONDS.indexOf('baseline') >= 0;
var MAN = obj(L.manifests);
var FAMS = arr(L.families).length ? arr(L.families) : keys(S.families);
var TASKS = arr(L.tasks);
var TMAP = {}; TASKS.forEach(function(t){ TMAP[t.id] = t; });
var SCORES = obj(L.scores), CHANGED = obj(L.changed);
function ctype(id){ var t = obj(CMAP[id]).type || obj(MAN[id]).type; return t === 'baseline' || t === 'intervention' || t === 'control' ? t : 'control'; }
function clabel(id){ return obj(MAN[id]).label || obj(CMAP[id]).label || ''; }
function cspec(id){ return obj(obj(MAN[id]).spec || obj(CMAP[id]).spec); }
function badge(id){ var t = ctype(id); return '<span class="badge t-' + t + '"><i></i>' + esc(t) + '</span>'; }
function cname(id){ return '<span class="nw"><span class="sw t-' + ctype(id) + '"></span><span class="mono">' + esc(id) + '</span></span>'; }
function typeLegend(extra){ return '<div class="legend"><span><i class="sw t-baseline"></i>baseline</span><span><i class="sw t-intervention"></i>intervention</span><span><i class="sw t-control"></i>control</span>' + (extra || '') + '</div>'; }
function layersText(ls){ ls = arr(ls); if (!ls.length) return 'n/a'; var s = ls.slice().sort(function(a,b){ return a-b; }), contiguous = s.every(function(v,i){ return i === 0 || v === s[i-1] + 1; }); return contiguous && s.length > 1 ? s[0] + ' to ' + s[s.length-1] : s.join(', '); }
function magnitudeText(sp){ sp = obj(sp); if (!sp.method) return 'none'; if (sp.method === 'noop') return 'gain x1.00 (values rewritten unchanged)'; if (!isNum(sp.eps)) return 'n/a';
  if (sp.method === 'scale') return 'gain x' + (1 + sp.eps).toFixed(2) + ' (eps ' + (sp.eps > 0 ? '+' : '−') + Math.abs(sp.eps).toFixed(2) + ')';
  if (sp.method === 'random_sign') return 'gain x(1 ± ' + Math.abs(sp.eps).toFixed(2) + '), random sign per element';
  return 'eps ' + sp.eps; }
function interventionLine(id){ var sp = cspec(id), m = obj(MAN[id]), bits = [];
  if (sp.module) bits.push('module ' + sp.module); if (arr(sp.layers).length) bits.push('blocks ' + layersText(sp.layers));
  if (sp.method) bits.push('method ' + sp.method); if (sp.method) bits.push(magnitudeText(sp)); if (sp.seed !== undefined && sp.seed !== null) bits.push('seed ' + sp.seed);
  if (m.artifact_sha256) bits.push('artifact sha256 ' + short(m.artifact_sha256, 16));
  if (m.identical_to_baseline === true) bits.push('artifact byte-identical to baseline');
  return (clabel(id) || (id === 'baseline' ? 'unchanged model' : 'no label')) + (bits.length ? ' [' + bits.join('; ') + ']' : ''); }
function score(c, id){ var v = obj(SCORES[c])[id]; return v === 1 || v === 0 || v === -1 ? v : undefined; }
function miniRate(r, id){ r = obj(r); if (!isNum(r.rate)) return '<span class="muted">n/a' + (isNum(r.n) ? ' (0/' + r.n + ')' : '') + '</span>';
  return '<span class="nw"><span class="mini"><i class="t-' + ctype(id) + '" style="width:' + (r.rate*100).toFixed(1) + '%"></i></span>' + pct(r.rate) + ' <span class="muted">' + rk(r) + '</span></span>'; }
function rateTip(name, r){ r = obj(r); var c = ci(r.ci95); return name + '\n' + pct(r.rate) + (rk(r) ? ' (' + rk(r) + ')' : '') + (c ? '\n95% Wilson interval ' + pct(c[0]) + ' to ' + pct(c[1]) : ''); }

/* ---------- heat colors (computed per color scheme) ---------- */
var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : {matches:false};
var SEQ = ['#cde2fb','#b7d3f6','#9ec5f4','#86b6ef','#6da7ec','#5598e7','#3987e5','#2a78d6','#256abf','#1c5cab','#184f95','#104281','#0d366b'];
function rgb(h){ return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; }
function mix(a, b, t){ a = rgb(a); b = rgb(b); return [0,1,2].map(function(i){ return Math.round(a[i] + (b[i]-a[i])*t); }); }
function cssrgb(c){ return 'rgb(' + c.join(',') + ')'; }
function inkOn(c){ var l = (0.2126*c[0] + 0.7152*c[1] + 0.0722*c[2]) / 255; return l > 0.52 ? '#0b0b0b' : '#ffffff'; }
function seqColor(t){ t = Math.max(0, Math.min(1, t)); var st = mq.matches ? SEQ.slice().reverse() : SEQ; var x = t*(st.length-1), i = Math.min(st.length-2, Math.floor(x)); return mix(st[i], st[i+1], x-i); }
function divColor(v, m){ var t = Math.max(-1, Math.min(1, m ? v/m : 0)); var mid = mq.matches ? '#383835' : '#f0efec';
  var pole = t < 0 ? (mq.matches ? '#e66767' : '#c93a39') : (mq.matches ? '#3987e5' : '#1c5cab'); return mix(mid, pole, Math.abs(t)); }

/* ---------- SVG charts ---------- */
var CW = 1160, LG = 170, RG = 340, RH = 30;
function xAxis(ticks, x, y0, y1, fmt){ return ticks.map(function(t){ return '<line class="gridl" x1="' + x(t) + '" x2="' + x(t) + '" y1="' + y0 + '" y2="' + y1 + '"/><text class="tick" text-anchor="middle" x="' + x(t) + '" y="' + (y1 + 15) + '">' + esc(fmt(t)) + '</text>'; }).join(''); }
function barChart(rows, axisLabel){
  if (!rows.length) return na();
  var H = rows.length*RH + 44, y0 = 6, y1 = y0 + rows.length*RH;
  var x = function(v){ return LG + v*(CW - LG - RG); };
  var s = '<svg class="chart" viewBox="0 0 ' + CW + ' ' + H + '" role="img" aria-label="' + esc(axisLabel) + '">' + xAxis([0,.25,.5,.75,1], x, y0, y1, function(t){ return (t*100) + '%'; });
  rows.forEach(function(r, i){
    var cy = y0 + i*RH + RH/2, t = 'f-' + r.type;
    s += '<g class="row" tabindex="0" data-tip="' + esc(r.tip) + '"><rect class="hit" x="0" y="' + (cy - RH/2) + '" width="' + CW + '" height="' + RH + '"/>';
    s += '<text class="lbl" text-anchor="end" x="' + (LG - 10) + '" y="' + (cy + 4) + '">' + esc(r.label) + '</text>';
    if (isNum(r.rate)){
      var w = Math.max(0, x(r.rate) - LG), rr = Math.min(4, w/2);
      s += '<path class="' + t + '" d="M' + LG + ' ' + (cy-6) + 'h' + (w-rr) + 'a' + rr + ' ' + rr + ' 0 0 1 ' + rr + ' ' + rr + 'v' + (12-2*rr) + 'a' + rr + ' ' + rr + ' 0 0 1 -' + rr + ' ' + rr + 'h-' + (w-rr) + 'z"/>';
      if (r.ci) s += '<line class="ci" x1="' + x(r.ci[0]) + '" x2="' + x(r.ci[1]) + '" y1="' + cy + '" y2="' + cy + '"/><line class="ci" x1="' + x(r.ci[0]) + '" x2="' + x(r.ci[0]) + '" y1="' + (cy-4) + '" y2="' + (cy+4) + '"/><line class="ci" x1="' + x(r.ci[1]) + '" x2="' + x(r.ci[1]) + '" y1="' + (cy-4) + '" y2="' + (cy+4) + '"/>';
    }
    s += '<text x="' + (CW - RG + 12) + '" y="' + (cy + 4) + '">' + esc(r.text) + '</text></g>';
  });
  s += '<line class="axisl" x1="' + LG + '" x2="' + LG + '" y1="' + y0 + '" y2="' + y1 + '"/><text class="tick" text-anchor="middle" x="' + x(.5) + '" y="' + (H - 4) + '">' + esc(axisLabel) + '</text></svg>';
  return '<div class="scroll">' + s + '</div>';
}
function forest(rows, axisLabel){
  rows = rows.filter(function(r){ return r.marks.some(function(m){ return isNum(m.d); }); });
  if (!rows.length) return na();
  var m = 0; rows.forEach(function(r){ r.marks.forEach(function(k){ [k.d].concat(k.ci || []).forEach(function(v){ if (isNum(v)) m = Math.max(m, Math.abs(v)); }); }); });
  m = m <= 0.1 ? Math.max(0.02, Math.ceil(m*50 - 1e-9)/50) : Math.ceil(m*10 - 1e-9)/10;
  var H = rows.length*RH + 44, y0 = 6, y1 = y0 + rows.length*RH;
  var x = function(v){ return LG + (v + m)/(2*m)*(CW - LG - RG); };
  var s = '<svg class="chart" viewBox="0 0 ' + CW + ' ' + H + '" role="img" aria-label="' + esc(axisLabel) + '">' + xAxis([-m, -m/2, 0, m/2, m], x, y0, y1, function(t){ return (t > 0 ? '+' : t < 0 ? '−' : '') + (+Math.abs(t*100).toFixed(1)) + ' pp'; });
  s += '<line class="axisl" x1="' + x(0) + '" x2="' + x(0) + '" y1="' + y0 + '" y2="' + y1 + '"/>';
  rows.forEach(function(r, i){
    var cy0 = y0 + i*RH + RH/2, n = r.marks.length;
    s += '<g class="row" tabindex="0" data-tip="' + esc(r.tip) + '"><rect class="hit" x="0" y="' + (cy0 - RH/2) + '" width="' + CW + '" height="' + RH + '"/>';

var heatMode = 'rate';
function heatTable(rowKeys, cellFn, opts){ // cellFn(row, cond) -> {v, text, tip, n} ; opts.mode rate|diff ; opts.m ; opts.click
  var h = '<div class="scroll"><table class="heat"><tr><th></th>' + DCONDS.map(function(c){ return '<th data-tip="' + esc(c + ': ' + clabel(c)) + '"><span class="sw t-' + ctype(c) + '"></span><span class="mono">' + esc(c) + '</span></th>'; }).join('') + '</tr>';
  rowKeys.forEach(function(r){ h += '<tr><th class="rowh">' + esc(r) + '</th>' + DCONDS.map(function(c){ var x = cellFn(r, c); if (!x || !isNum(x.v)) return '<td><span class="nocell" data-tip="' + esc((x && x.tip) || (r + ' / ' + c + '\nno data yet')) + '">·</span></td>';
      var col = opts.mode === 'diff' ? divColor(x.v, opts.m) : seqColor(x.v);
      return '<td><button type="button" ' + (opts.click ? 'data-act="cell" data-fam="' + esc(r) + '" data-cond="' + esc(c) + '" ' : '') + 'style="background:' + cssrgb(col) + ';color:' + inkOn(col) + (opts.click ? '' : ';cursor:default') + '" data-tip="' + esc(x.tip) + '">' + esc(x.text) + '</button></td>'; }).join('') + '</tr>'; });
  return h + '</table></div>';
}
function scaleLegend(mode, m){ var n = 9, cells = ''; for (var i = 0; i < n; i++){ var t = i/(n-1), col = mode === 'diff' ? divColor((t*2-1)*m, m) : seqColor(t); cells += '<i style="display:inline-block;width:22px;height:10px;background:' + cssrgb(col) + '"></i>'; }
  return '<div class="legend"><span>' + (mode === 'diff' ? '−' + (m*100).toFixed(0) + ' pp (worse than baseline) ' : '0% ') + '&nbsp;' + cells + '&nbsp; ' + (mode === 'diff' ? '+' + (m*100).toFixed(0) + ' pp (better than baseline)' : '100% pass rate') + '</span></div>'; }

    heatTable(FAMS, function(f, c){ var r = obj(obj(F[f])[c]);
      if (heatMode === 'diff'){ if (c === 'baseline') return {v:0, text:'ref', tip:f + ' / baseline\nreference condition, pass rate ' + pct(r.rate)}; var o = obj(obj(obj(VB[c]).by_family)[f]), cc = ci(o.ci95); return {v:o.diff, text:isNum(o.diff) ? pp(o.diff).replace(' pp','') : '', tip:f + ' / ' + c + '\n' + pp(o.diff) + ' on ' + int(o.n) + ' paired tasks' + (cc ? '\n95% bootstrap interval ' + pp(cc[0]) + ' to ' + pp(cc[1]) : '') + '\nregressed ' + int(o.regressed) + ', improved ' + int(o.improved) + '\nHolm-adjusted McNemar p ' + pv(o.mcnemar_p_holm) + '\nClick to open these tasks in the trace explorer'}; }
      return {v:r.n ? r.rate : null, text:pct(r.rate, 0), tip:rateTip(f + ' / ' + c, r) + '\nClick to open these tasks in the trace explorer'}; }, {mode:heatMode, m:m, click:true}) +

  $('famBody').innerHTML = h;
}

section('controls', 'Controls', 'Controls', 'Two kinds of control: conditions whose model file is byte-identical to the baseline (no-op edit, rollback) should reproduce baseline outputs exactly, and matched random controls apply an edit of the same size as an intervention but in random directions.', function(){

    h += '<div class="scroll"><table><tr><th>intervention</th><th>random control</th><th class="num">paired tasks</th><th class="num">difference</th><th class="num">95% interval</th><th class="num">intervention only passes</th><th class="num">control only passes</th><th class="num">McNemar p</th></tr>' + mk.map(function(id){ var x = obj(MC[id]), o = obj(x.intervention_minus_control), c = ci(o.ci95); return '<tr><td>' + cname(id) + '</td><td>' + cname(x.control) + '</td><td class="num">' + int(o.n) + '</td><td class="num">' + pp(o.diff) + '</td><td class="num">' + (c ? pp(c[0]) + ' to ' + pp(c[1]) : 'n/a') + '</td><td class="num">' + int(o.improved) + '</td><td class="num">' + int(o.regressed) + '</td><td class="num">' + pv(o.mcnemar_p) + '</td></tr>'; }).join('') + '</table></div>';

section('methods', 'Methods', 'Methods and limitations', '', function(){
  var is = obj(rt.inference_settings), setTxt = keys(is).length ? keys(is).filter(function(k){ return typeof is[k] !== 'object'; }).map(function(k){ return k + ' ' + is[k]; }).join(', ') : 'settings ' + NA;
  var perFam = FAMS.length && nTasks ? nTasks/FAMS.length : null;
  return '<div class="grid2"><div class="card"><h3 style="margin-top:0">Methods</h3><ul style="padding-left:18px;margin:4px 0">' +
    '<li><b>Model and edits.</b> Each condition is a separate copy of the baseline model file with the listed tensors edited in place; the manifest records hashes before and after. The baseline file is never modified.</li>' +
    '<li><b>Tasks.</b> ' + (nTasks ? int(nTasks) + ' held-out tasks in ' + FAMS.length + ' families' + (perFam && perFam === Math.round(perFam) ? ' (' + perFam + ' each)' : '') : 'Task counts are ' + NA) + '. Edit strengths were chosen on separate dev tasks only.</li>' +
    '<li><b>Inference.</b> Deterministic decoding (' + esc(setTxt) + '); ' + esc(rt.thinking ? 'thinking ' + rt.thinking : 'thinking mode ' + NA) + '.</li>' +
    '<li><b>Scoring.</b> Each task has typed automatic checks; an episode passes only if all of them pass. Errors count as not passed.</li>' +
    '<li><b>Statistics.</b> Pass rates carry 95% Wilson intervals. Comparisons with baseline are paired on task: the difference carries a paired bootstrap interval over tasks, and significance uses the exact McNemar test with Holm adjustment across conditions.</li>' +
    '<li><b>Controls.</b> A no-op edit and a rollback check the edit pipeline itself; matched random controls separate the effect of the edit direction from the effect of its size.</li></ul></div>' +
    '<div class="card"><h3 style="margin-top:0">Limitations</h3><ul style="padding-left:18px;margin:4px 0">' +
    '<li>Sample size is ' + (nTasks ? int(nTasks) : 'n/a') + ' tasks per condition, not the ' + int(REQUESTED_PER_CONDITION) + ' originally requested; small effects and per-family cells have wide intervals.</li>' +
    '<li>One quantized model, one seed and deterministic decoding: results describe this model file and these prompts, not Qwen models in general.</li>' +
    '<li>Only unquantized normalization gains in a fixed range of blocks were edited; other kinds of edit were not tested.</li>' +
    '<li>Tasks were written and reviewed by AI subagents and scored by rule-based checks, which can mis-score unusual replies. See the score audit when present.</li>' +
    '<li>Safety, calibration and tool metrics rely on tags and patterns in the reply, so a reply that ignores the requested format is counted as missing, not interpreted.</li>' +
    (planned !== null && episodesRun < planned ? '<li>The run is incomplete: ' + int(episodesRun) + ' of ' + int(planned) + ' episodes are present, and conditions may cover different subsets of tasks until it finishes.</li>' : '') + '</ul></div></div>' +
    '<div class="card interp"><h3 style="margin-top:0">Measured versus interpretation</h3><p><b>Measured:</b> everything computed directly from episode records by lab/analyze.py and lab/report_data.py: counts, pass rates, intervals, paired differences, p values, behavior metrics, latency, tokens, hashes, manifests and the traces themselves.</p><p><b>Interpretation:</b> the Findings text (when present), the analyst notes and the score audit, which are written by the coordinator or by AI subagents after reading the measurements and sampled traces. They are marked with a gray left border. Example labels (representative, edge case, failure) are assigned by the stated selection rule, not by judgment, unless marked as an analyst pick.</p></div>';
});

document.addEventListener('input', function(e){ if (e.target.getAttribute && e.target.getAttribute('data-xf') === 'q'){ X.q = e.target.value; X.page = 0; renderXList(); } });

/* ---------- tooltip (hover and keyboard focus) ---------- */
var tip = $('tip');
function showTip(el, x, y){ tip.textContent = el.getAttribute('data-tip'); tip.style.display = 'block'; var w = tip.offsetWidth, hh = tip.offsetHeight; tip.style.left = Math.max(4, Math.min(window.innerWidth - w - 4, x + 14)) + 'px'; tip.style.top = (y + 18 + hh > window.innerHeight ? Math.max(4, y - hh - 10) : y + 18) + 'px'; }
document.addEventListener('pointermove', function(e){ var el = e.target.closest ? e.target.closest('[data-tip]') : null; if (el && el.getAttribute('data-tip')) showTip(el, e.clientX, e.clientY); else tip.style.display = 'none'; });
document.addEventListener('focusin', function(e){ var el = e.target.closest ? e.target.closest('[data-tip]') : null; if (el && el.getAttribute('data-tip')){ var r = el.getBoundingClientRect(); showTip(el, r.left + r.width/2, r.bottom - 10); } });
document.addEventListener('focusout', function(){ tip.style.display = 'none'; });
document.addEventListener('scroll', function(){ tip.style.display = 'none'; }, {passive:true});
})();
</script>
</body>
